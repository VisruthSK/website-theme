name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE", "LICENSES/**"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE", "LICENSES/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build caches the optical-margin tables, line-break plans and
      # font subsets in node_modules/.astro/website-theme, keyed on the
      # font bytes and the source that produces them. Restore it so
      # unchanged inputs are not recomputed.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/website-theme
          key: website-theme-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/**', 'src/**', 'examples/**') }}
          restore-keys: website-theme-${{ runner.os }}-
      - run: pnpm schema:check
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:standard
      - run: pnpm knip
      - run: pnpm format
      - run: pnpm flatten --check

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restore the build cache (optical margins, line-break plans, font
      # subsets) so unchanged inputs are not recomputed.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/website-theme
          key: website-theme-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/**', 'src/**', 'examples/**') }}
          restore-keys: website-theme-${{ runner.os }}-
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      # Key the browser cache on the runner image too: a browser saved on
      # one Ubuntu release fails to launch on the next (e.g. WebKit from
      # 24.04 needs libicudata.so.74, gone on 26.04).
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ env.ImageOS || 'unknown' }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: >-
          pnpm exec playwright test
          --project=example-${{ matrix.browser }}
          --project=minimal-${{ matrix.browser }}
          ${{ matrix.browser == 'chromium' && '--project=unit' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restore the build cache so the unchanged parts of the build are
      # not recomputed.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro/website-theme
          key: website-theme-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/**', 'src/**', 'examples/**') }}
          restore-keys: website-theme-${{ runner.os }}-
      - run: node scripts/build.mjs examples/minimal
      - run: pnpm exec astro preview --root examples/minimal --host 127.0.0.1 --port 4173 &
      - run: curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:4173/
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/journal/
            http://127.0.0.1:4173/journal/the-masque-of-the-red-death/
          configPath: .github/lighthouserc.json
          runs: 1
          uploadArtifacts: false
